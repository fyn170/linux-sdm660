name: Build X00TD Mainline

on:
  workflow_dispatch:
  push:
    branches:
      - 'qcom-sdm660-*'

jobs:
  build-all:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      DEVICE: asus-x00td
      LOCALVERSION: "-x00td-mainline"
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libelf-dev \
          crossbuild-essential-arm64 device-tree-compiler

      - name: Prepare Defconfig
        run: |
          mkdir -p .output
          make O=.output sdm660_defconfig

      - name: Inject Networking Drivers
        run: |
          KCONFIG=.output/.config
          
          ./scripts/config --file $KCONFIG --enable CONFIG_QCOM_IPCC
          ./scripts/config --file $KCONFIG --enable CONFIG_QCOM_QMP
          ./scripts/config --file $KCONFIG --enable CONFIG_QCOM_AOSS_QMP
          ./scripts/config --file $KCONFIG --enable CONFIG_QCOM_PIL_INFO
          ./scripts/config --file $KCONFIG --enable CONFIG_QCOM_SYSMON
          ./scripts/config --file $KCONFIG --enable CONFIG_QCOM_RPROC_COMMON
          ./scripts/config --file $KCONFIG --enable CONFIG_QCOM_Q6V5_COMMON
          ./scripts/config --file $KCONFIG --enable CONFIG_QCOM_Q6V5_WCSS
          ./scripts/config --file $KCONFIG --enable CONFIG_QCOM_Q6V5_MSS
          ./scripts/config --file $KCONFIG --enable CONFIG_QCOM_WCNSS_PIL
          
          ./scripts/config --file $KCONFIG --enable CONFIG_ATH10K
          ./scripts/config --file $KCONFIG --enable CONFIG_ATH10K_SNOC
          ./scripts/config --file $KCONFIG --enable CONFIG_WLAN_VENDOR_ATH
          ./scripts/config --file $KCONFIG --enable CONFIG_QCOM_IPA
          ./scripts/config --file $KCONFIG --enable CONFIG_CRYPTO_ARC4
          ./scripts/config --file $KCONFIG --enable CONFIG_RFKILL
          
          ./scripts/config --file $KCONFIG --enable CONFIG_INTERCONNECT
          ./scripts/config --file $KCONFIG --enable CONFIG_INTERCONNECT_QCOM
          ./scripts/config --file $KCONFIG --enable CONFIG_INTERCONNECT_QCOM_SDM660

          ./scripts/config --file $KCONFIG --enable CONFIG_BRIDGE
          ./scripts/config --file $KCONFIG --enable CONFIG_VLAN_8021Q
          ./scripts/config --file $KCONFIG --enable CONFIG_TUN
          ./scripts/config --file $KCONFIG --enable CONFIG_PPP
          ./scripts/config --file $KCONFIG --enable CONFIG_IP_NF_IPTABLES
          ./scripts/config --file $KCONFIG --enable CONFIG_IP_NF_NAT
          ./scripts/config --file $KCONFIG --enable CONFIG_SQUASHFS
          ./scripts/config --file $KCONFIG --enable CONFIG_OVERLAY_FS

          ./scripts/config --file $KCONFIG --enable CONFIG_QRTR
          ./scripts/config --file $KCONFIG --enable CONFIG_QRTR_SMD
          ./scripts/config --file $KCONFIG --enable CONFIG_QRTR_TUN
          ./scripts/config --file $KCONFIG --enable CONFIG_QCOM_QMI_HELPERS
          ./scripts/config --file $KCONFIG --enable CONFIG_RPMSG_QCOM_SMD
          ./scripts/config --file $KCONFIG --enable CONFIG_QCOM_SMD_RPM
          
          make O=.output LOCALVERSION=$LOCALVERSION olddefconfig
          
      - name: Compile Kernel & DTB
        run: |
          make O=.output LOCALVERSION=$LOCALVERSION -j$(nproc) Image.gz dtbs modules

      - name: Prepare Output Directory
        run: |
          mkdir -p deploy/dtb
          cp .output/arch/arm64/boot/Image.gz deploy/vmlinuz
          
          DTB_PATH=$(find .output/arch/arm64/boot/dts/qcom/ -name "*x00td*.dtb" | head -n 1)
          cp $DTB_PATH deploy/dtb/sdm660-asus-x00td.dtb

          cat <<EOF > deploy/extlinux.conf
          timeout 1
          default postmarketOS
          menu title boot X00TD mainline

          label postmarketOS
            kernel /vmlinuz
            fdt /dtb/sdm660-asus-x00td.dtb
            initrd /ramdisk.img
            append console=ttyMSM0,115200n8 earlycon=msm_geni_serial,0x00a84000 root=/dev/mmcblk1p2 rw rootwait
          EOF

      - name: Generate ramdisk
        run: |
          echo "OpenWrt Placeholder" > ramdisk.txt
          gzip -c ramdisk.txt > deploy/ramdisk.img

      - name: Create boot.img
        run: |
          git clone https://github.com/draekko/AIK-Linux
          
          AIK_MKBOOT="./AIK-Linux/bin/linux/x86_64/mkbootimg"
          chmod +x $AIK_MKBOOT
          
          DTB_FILE=$(find .output/arch/arm64/boot/dts/qcom/ -name "*x00td.dtb" | head -n 1)
          cat .output/arch/arm64/boot/Image.gz $DTB_FILE > Image.gz-dtb
          
          $AIK_MKBOOT \
            --kernel Image.gz-dtb \
            --ramdisk deploy/ramdisk.img \
            --base 0x80000000 \
            --pagesize 2048 \
            --cmdline "console=ttyMSM0,115200n8 earlycon=msm_geni_serial,0x00a84000 root=/dev/mmcblk1p2 rw rootwait" \
            -o deploy/boot.img

      - name: Package Kernel Modules
        run: |
          make O=.output INSTALL_MOD_PATH=../deploy/modules modules_install
          cd deploy/modules && tar -czf ../modules.tar.gz .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: X00TD-Mainline-AIK
          path: deploy/
