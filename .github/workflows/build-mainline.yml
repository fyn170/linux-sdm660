name: Build X00TD Mainline

on:
  workflow_dispatch:
  push:
    branches:
      - 'qcom-sdm660-*'

jobs:
  build-all:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      DEVICE: asus-x00td
      LOCALVERSION: "-x00td-mainline"
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libelf-dev \
          crossbuild-essential-arm64 device-tree-compiler python3

      - name: Prepare Defconfig
        run: |
          mkdir -p .output
          make O=.output sdm660_defconfig

      - name: Networking Drivers
        run: |
          KCONFIG=.output/.config
          ./scripts/config --file $KCONFIG --enable CONFIG_WCN3990
          ./scripts/config --file $KCONFIG --enable CONFIG_QCOM_IPA
          ./scripts/config --file $KCONFIG --enable CONFIG_QCOM_BAM_DMUX
          ./scripts/config --file $KCONFIG --enable CONFIG_BRIDGE
          ./scripts/config --file $KCONFIG --enable CONFIG_VLAN_8021Q
          ./scripts/config --file $KCONFIG --enable CONFIG_TUN
          ./scripts/config --file $KCONFIG --enable CONFIG_PPP
          ./scripts/config --file $KCONFIG --enable CONFIG_IP_NF_IPTABLES
          ./scripts/config --file $KCONFIG --enable CONFIG_IP_NF_NAT
          ./scripts/config --file $KCONFIG --enable CONFIG_NETFILTER_XT_MATCH_COMMENT
          ./scripts/config --file $KCONFIG --enable CONFIG_SQUASHFS
          ./scripts/config --file $KCONFIG --enable CONFIG_OVERLAY_FS
          
          make O=.output LOCALVERSION=$LOCALVERSION olddefconfig

      - name: Compile Kernel & DTB
        run: |
          make O=.output LOCALVERSION=$LOCALVERSION -j$(nproc) Image.gz dtbs modules

      - name: Prepare Output Directory
        run: |
          mkdir -p deploy/dtb
          cp .output/arch/arm64/boot/Image.gz deploy/vmlinuz
          
          DTB_PATH=$(find .output/arch/arm64/boot/dts/qcom/ -name "*x00td*.dtb" | head -n 1)
          cp $DTB_PATH deploy/dtb/sdm660-asus-x00td.dtb

          cat <<EOF > deploy/extlinux.conf
          timeout 1
          default postmarketOS
          menu title boot X00TD mainline

          label postmarketOS
            kernel /vmlinuz
            fdt /dtb/sdm660-asus-x00td.dtb
            initrd /ramdisk.img
            append console=ttyMSM0,115200n8 earlycon=msm_geni_serial,0x00a84000 root=/dev/mmcblk1p2 rw rootwait
          EOF

      - name: Generate ramdisk
        run: |
          echo "OpenWrt Placeholder" > ramdisk.txt
          gzip -c ramdisk.txt > deploy/ramdisk.img

      - name: Create boot.img
        run: |
          # Menggunakan mirror osm0sis yang lebih stabil
          curl -Lo mkbootimg.py https://raw.githubusercontent.com/osm0sis/mkbootimg/master/mkbootimg.py
          chmod +x mkbootimg.py
          
          # Verifikasi file (jika bukan python script, maka curl gagal)
          if ! grep -q "import" mkbootimg.py; then
            echo "Error: Gagal mengunduh mkbootimg.py yang valid (404 Not Found)"
            exit 1
          fi

          DTB_FILE=$(find .output/arch/arm64/boot/dts/qcom/ -name "*x00td.dtb" | head -n 1)
          cat .output/arch/arm64/boot/Image.gz $DTB_FILE > Image.gz-dtb
          
          python3 mkbootimg.py \
            --kernel Image.gz-dtb \
            --ramdisk deploy/ramdisk.img \
            --base 0x80000000 \
            --pagesize 2048 \
            --cmdline "console=ttyMSM0,115200n8 earlycon=msm_geni_serial,0x00a84000 root=/dev/mmcblk1p2 rw rootwait" \
            -o deploy/boot.img

      - name: Package Kernel Modules
        run: |
          make O=.output INSTALL_MOD_PATH=../deploy/modules modules_install
          cd deploy/modules && tar -czf ../modules.tar.gz .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: X00TD-Mainline
          path: |
            deploy/boot.img
            deploy/vmlinuz
            deploy/dtb/
            deploy/extlinux.conf
            deploy/ramdisk.img
            deploy/modules.tar.gz
